<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
<!-- Wispr (LOR-428): the Moonwell Orb from the overlay (wispr.py), drawn by us. A white-hot core, an ice-blue glow,
     an uneven blue bloom fading to dusk purple, and a few motes. -->
<defs>
<radialGradient id="wb"><stop offset="0" stop-color="#5f8dff" stop-opacity="0.46"/><stop offset="0.35" stop-color="#4f6fe8" stop-opacity="0.24"/><stop offset="0.62" stop-color="#5a45c4" stop-opacity="0.1"/><stop offset="1" stop-color="#3c32a0" stop-opacity="0"/></radialGradient>
<radialGradient id="wl1"><stop offset="0" stop-color="#82c3ff" stop-opacity="0.32"/><stop offset="1" stop-color="#82c3ff" stop-opacity="0"/></radialGradient>
<radialGradient id="wl2"><stop offset="0" stop-color="#6e96ff" stop-opacity="0.28"/><stop offset="1" stop-color="#6e96ff" stop-opacity="0"/></radialGradient>
<radialGradient id="wg"><stop offset="0" stop-color="#e1f4ff" stop-opacity="0.95"/><stop offset="0.22" stop-color="#96d2ff" stop-opacity="0.75"/><stop offset="0.46" stop-color="#5096ff" stop-opacity="0.36"/><stop offset="0.7" stop-color="#3c6ef0" stop-opacity="0"/></radialGradient>
<radialGradient id="wc"><stop offset="0" stop-color="#ffffff"/><stop offset="0.4" stop-color="#fbfeff"/><stop offset="0.66" stop-color="#d3eeff" stop-opacity="0.95"/><stop offset="1" stop-color="#aadcff" stop-opacity="0"/></radialGradient>
<radialGradient id="wm"><stop offset="0" stop-color="#ffffff"/><stop offset="0.35" stop-color="#e8f6ff" stop-opacity="0.9"/><stop offset="1" stop-color="#96d2ff" stop-opacity="0"/></radialGradient>
</defs>
<circle cx="100" cy="100" r="98" fill="url(#wb)"/>
<ellipse cx="114" cy="90" rx="64" ry="52" fill="url(#wl1)"/>
<ellipse cx="86" cy="112" rx="54" ry="62" fill="url(#wl2)"/>
<circle cx="100" cy="100" r="74" fill="url(#wg)"/>
<circle cx="100" cy="100" r="33" fill="url(#wc)"/>
<g fill="url(#wm)">
<circle cx="58" cy="56" r="6"/><circle cx="144" cy="46" r="4.5"/><circle cx="152" cy="122" r="5.5"/>
<circle cx="50" cy="134" r="4"/><circle cx="121" cy="27" r="3.5"/><circle cx="80" cy="164" r="4.5"/>
<circle cx="168" cy="84" r="3.2"/><circle cx="36" cy="94" r="3"/>
</g>
</svg>
