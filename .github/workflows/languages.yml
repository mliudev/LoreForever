# Uploads the language packs to their CurseForge projects (release/curseforge.json). scripts/publish-language-packs.sh
# starts it once their zips and manifest.json are on the "languages" release: the packs ship on their own, never with
# an add-on release. Each zip is checked against the live add-on's data (the newest release's core, checked out below),
# and only a changed one uploads.
name: CurseForge languages

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Where the zips are: the languages release (an add-on tag from an older dispatch is ignored)"
        required: false
        default: languages

permissions:
  contents: write

# The upload record is separate from narration, and language runs serialize their updates.
concurrency:
  group: curseforge-languages
  cancel-in-progress: false

jobs:
  curseforge-languages:
    runs-on: ubuntu-24.04   # not ubuntu-latest, which moves to Ubuntu 26 from 2026-10-19 (LOR-589)
    env:
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: The add-on players run
        id: live
        # The newest add-on release (vX.Y.Z, not a Willo one), as curseforge_voices.newest_release picks it.
        run: |
          tag="$(gh release list --limit 100 --json tagName,name,isDraft --jq '[.[] | select(.isDraft | not)
            | select(.tagName | test("^v[0-9]+[.][0-9]+[.][0-9]+$")) | select(.name | startswith("Willo") | not)
            | .tagName] | sort_by(ltrimstr("v") | split(".") | map(tonumber)) | last')"
          [ -n "$tag" ] && [ "$tag" != null ] || { echo "::error::no add-on release to check the packs against"; exit 1; }
          echo "tag=$tag" >>"$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.live.outputs.tag }}
          sparse-checkout: |
            addon/LoreForever
      # The uploader and the project ids from main: self-synced by publish-language-packs.sh (single-writer under scripts/languages/).
      - uses: actions/checkout@v7
        with:
          path: config
          sparse-checkout: |
            scripts/languages
      - name: Upload the translations
        run: |
          mkdir -p release scripts
          cp config/scripts/languages/curseforge.json release/curseforge.json
          cp config/scripts/languages/curseforge_voices.py scripts/curseforge_voices.py
          python3 scripts/curseforge_voices.py upload --from-release --languages
