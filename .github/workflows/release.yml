# Builds the download zip (the add-on with every default narration and the language packs), publishes it as a GitHub
# release with that version's notes from CHANGELOG.md, and uploads it to CurseForge. Also builds the optional narration
# packs (the female narrator) and adds them to the GitHub release. The add-on's Windows installer builds beside it and
# goes in the same publish when it's signed and checked by then (it usually is), else joins the release once it is
# (attach-installer): the zip never waits on it (docs/releases.md, rule 1; docs/qa/installers-own-release.md).
# Willo, the companion app, releases on her own (willo.yml), not here.
# CurseForge refuses additional files for this project (errorCode 1011), and as normal files the CurseForge app would
# install a pack in place of the add-on, so a voice goes to CurseForge only as its own project (release/curseforge.json,
# the curseforge-voices job). The site's /voices links follow releases/latest.
# Runs when a version tag is pushed; the maintainer's scripts/release.sh does that. The tag must match
# "## Version" in addon/LoreForever/LoreForever.toc. Run it by hand (Actions > Release > Run workflow) to
# rebuild the assets of an existing tag; that only uploads to CurseForge if you tick the box.
name: Release

on:
  push:
    tags: ["v[0-9]*"]   # not "v*": that also matched the "voices" tag
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to rebuild, e.g. v0.2.0"
        required: true
      curseforge:
        description: "Also upload the zip to CurseForge as a new file"
        type: boolean
        default: false

permissions:
  contents: write
  actions: read

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  GH_REPO: ${{ github.repository }}
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

# The Linux jobs name ubuntu-24.04, not ubuntu-latest: that moves to Ubuntu 26 from 2026-10-19, and a new image under a
# real release could change the zip the zip job must rebuild byte for byte. Moving on is its own change (LOR-589).
jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      source_commit: ${{ steps.metadata.outputs.source_commit }}
      published: ${{ steps.metadata.outputs.published }}
      zip_sha256: ${{ steps.metadata.outputs.zip_sha256 }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
          sparse-checkout: addon/LoreForever
      # The orchestration helper comes from this workflow revision, including dispatches for an older tag.
      - uses: actions/checkout@v7
        with:
          path: ci
          sparse-checkout: |
            scripts
            release
      - id: metadata
        name: Validate source and prepare an unpublished draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 ci/scripts/release_staging.py --commit "$(git rev-parse HEAD)" prepare

  zip:
    needs: prepare
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.source_commit }}
      - uses: actions/checkout@v7
        with:
          path: ci
          sparse-checkout: |
            scripts
            release
      - id: version
        name: Check the tag matches the .toc
        run: |
          version=$(sed -n 's/^## Version: *//p' addon/LoreForever/LoreForever.toc | tr -d '\r')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          [ "v$version" = "$TAG" ] || { echo "::error::tag $TAG doesn't match .toc version $version"; exit 1; }
      # The recordings aren't in git (LOR-133): put back the core ones the tag's release/audio.json names, from the
      # "audio" release. Tags from before that kept them in git (and have no scripts/audio_assets.py), so those build as
      # they are.
      - name: Fetch the core recordings
        run: |
          if [ -f scripts/audio_assets.py ]; then
            if python3 scripts/audio_assets.py fetch --help 2>&1 | grep -q -- '--core'; then
              python3 scripts/audio_assets.py fetch --core
            else
              python3 scripts/audio_assets.py fetch
            fi
          fi
      # The zip QA tested is the one that ships: scripts/release.sh puts its sha256 in the tag's message. Optional
      # narration packs build in their own job (narration-packs) so they never hold up the core release.
      - name: Build the core zip
        run: |
          bash scripts/build-release.sh || exit 1
          mv "dist/LoreForever-${{ steps.version.outputs.version }}.zip" dist/LoreForever.zip
          want='${{ needs.prepare.outputs.zip_sha256 }}'
          got=$(sha256sum dist/LoreForever.zip | cut -d' ' -f1)
          if [ -n "$want" ] && [ "$want" != "$got" ]; then
            echo "::error::The zip came out as sha256 $got, not $want, the zip scripts/release.sh built and QA tested."
            exit 1
          fi
          echo "zip sha256 $got${want:+, the one QA tested}"
      - name: Freeze source-bound core asset digest and content fingerprints
        run: |
          zip_arg=()
          if [ -n '${{ needs.prepare.outputs.zip_sha256 }}' ]; then
            zip_arg=(--zip-sha256 '${{ needs.prepare.outputs.zip_sha256 }}')
          fi
          python3 ci/scripts/release_staging.py --commit "${{ needs.prepare.outputs.source_commit }}" core-manifest \
            --core dist/LoreForever.zip --output dist/core-proof.json "${zip_arg[@]}"
      - name: Stage core asset directly from its Linux producer
        if: needs.prepare.outputs.published != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 ci/scripts/release_staging.py --commit "${{ needs.prepare.outputs.source_commit }}" stage \
            --manifest dist/core-proof.json --root dist/LoreForever.zip
      # Preserve the existing published-tag rebuild contract; only this exceptional path transfers full artifacts.
      - uses: actions/upload-artifact@v7
        if: needs.prepare.outputs.published == 'true'
        with:
          name: core-payload-${{ github.run_attempt }}
          path: dist/LoreForever.zip
          compression-level: 0
      - uses: actions/upload-artifact@v7
        with:
          name: core-proof-${{ github.run_attempt }}
          path: dist/core-proof.json
          compression-level: 0

  # Optional narration packs and installer download metadata: builds alongside zip so slow/failing optional packs
  # never delay publishing LoreForever.zip, and attaches monotonically after release and curseforge finish.
  narration-packs:
    needs: prepare
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.source_commit }}
      - uses: actions/checkout@v7
        with:
          path: ci
          sparse-checkout: |
            scripts
            release
      - id: version
        name: Check the tag matches the .toc
        run: |
          version=$(sed -n 's/^## Version: *//p' addon/LoreForever/LoreForever.toc | tr -d '\r')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          [ "v$version" = "$TAG" ] || { echo "::error::tag $TAG doesn't match .toc version $version"; exit 1; }
      - name: Fetch the recordings
        run: |
          if [ -f scripts/audio_assets.py ]; then python3 scripts/audio_assets.py fetch; fi
      # Build the narration packs (with the installer's downloads first) alongside build-release.sh so installer_downloads
      # gets the exact candidate LoreForever.zip while build-voice-packs.sh runs.
      - name: Build the zip and the narration packs, side by side, the installer's packs first
        run: |
          packs="$RUNNER_TEMP/packs"; mkdir -p "$packs"
          # Its own log and exit status in files: nothing of this step's output stays open, so the step can end.
          ( rc=0; LORE_INSTALLER_PACKS_READY="$packs/installer-ready" bash scripts/build-voice-packs.sh || rc=$?
            echo "$rc" > "$packs/exit.part"; mv "$packs/exit.part" "$packs/exit" ) > "$packs/log" 2>&1 < /dev/null &
          bash scripts/build-release.sh || exit 1
          mv "dist/LoreForever-${{ steps.version.outputs.version }}.zip" dist/LoreForever.zip
          want='${{ needs.prepare.outputs.zip_sha256 }}'
          got=$(sha256sum dist/LoreForever.zip | cut -d' ' -f1)
          if [ -n "$want" ] && [ "$want" != "$got" ]; then
            echo "::error::The zip came out as sha256 $got, not $want, the zip scripts/release.sh built and QA tested."
            exit 1
          fi
          echo "zip sha256 $got${want:+, the one QA tested}"
          deadline=$((SECONDS + 1800))
          until [ -e "$packs/installer-ready" ] || [ -e "$packs/exit" ]; do
            [ "$SECONDS" -lt "$deadline" ] || { echo "::error::scripts/build-voice-packs.sh is still running after 30 minutes"; exit 1; }
            sleep 1
          done
          if [ ! -e "$packs/installer-ready" ] && [ "$(cat "$packs/exit")" != 0 ]; then
            rc=$(cat "$packs/exit")
            echo "::group::The narration packs"; cat "$packs/log"; echo "::endgroup::"
            echo "::error::scripts/build-voice-packs.sh failed (exit $rc; its log is above)"; exit "$rc"
          fi
          if [ -e "$packs/installer-ready" ]; then
            echo "the installer's narration packs, ${SECONDS}s in: $(tr '\n' ' ' < "$packs/installer-ready")"
          else
            echo "every narration pack, ${SECONDS}s in (this tag's build-voice-packs.sh doesn't list the installer's)"
          fi
      - name: Freeze verified installer downloads and available transport shards, from the installer's packs
        run: |
          shopt -s nullglob
          mkdir -p dist/extra
          if [ -e "$RUNNER_TEMP/packs/installer-ready" ]; then
            mapfile -t ready < "$RUNNER_TEMP/packs/installer-ready"
          else   # a builder without the list has built every pack already
            ready=(); for zip in dist/packs/*.zip; do ready+=("${zip##*/}"); done
          fi
          for zip in "${ready[@]}"; do
            [[ "$zip" =~ ^[A-Za-z0-9_.-]+\.zip$ ]] || { echo "::error::Unexpected installer pack name: $zip"; exit 1; }
            mv "dist/packs/$zip" dist/extra/
          done
          python3 scripts/installer_downloads.py --transport dist/transport --packs dist/extra --output dist/extra \
            --published-transport release/transport-downloads.json --version "${{ steps.version.outputs.version }}" \
            --source-commit "$(git rev-parse HEAD)" --candidate-zip dist/LoreForever.zip \
            --base-url "https://github.com/${{ github.repository }}/releases/download/$TAG/"
      # Only what the installer builds and smoke-tests from, hard links to the files the release ships. packs-manifest
      # --handover then checks that the full build came to the same inputs.
      - name: Hand the installer its verified inputs while the other narration packs build
        run: |
          python3 ci/scripts/release_staging.py --commit "${{ needs.prepare.outputs.source_commit }}" handover \
            --core dist/LoreForever.zip --extras dist/extra --output dist/windows
      # upload-artifact (v4 on) makes the current-run artifact downloadable as soon as this step ends.
      - uses: actions/upload-artifact@v7
        with:
          name: installer-inputs-${{ github.run_attempt }}
          path: dist/windows/
          compression-level: 0
      # dist/extra/manifest.tsv: file, display name, version (one line per extra zip).
      - name: Wait for the other narration packs
        run: |
          packs="$RUNNER_TEMP/packs"; deadline=$((SECONDS + 1800))
          until [ -e "$packs/exit" ]; do
            [ "$SECONDS" -lt "$deadline" ] || { echo "::error::scripts/build-voice-packs.sh is still running after 30 minutes"; exit 1; }
            sleep 1
          done
          echo "::group::The narration packs"; cat "$packs/log"; echo "::endgroup::"
          rc=$(cat "$packs/exit")
          [ "$rc" = 0 ] || { echo "::error::scripts/build-voice-packs.sh failed (exit $rc; its log is above)"; exit "$rc" }
          shopt -s nullglob
          mv dist/packs/*.zip dist/packs/manifest.tsv dist/extra/
          python3 - <<'PY'
          import json
          from pathlib import Path
          root = Path('dist/extra')
          manifest = json.loads((root / 'transport-downloads.json').read_text())
          with (root / 'manifest.tsv').open('a') as listing:
              for source, pack in manifest['packs'].items():
                  for row in pack['shards']:
                      listing.write(row['archive'] + '\tTransport: ' + source + '\t' + manifest['releaseVersion'] + '\n')
          PY
          cat dist/extra/manifest.tsv
      # Also checks that the full build came to exactly the inputs handed to Windows, and enforces pack-holds.json fail-closed.
      - name: Freeze source-bound narration pack digests and content fingerprints
        run: |
          zip_arg=()
          if [ -n '${{ needs.prepare.outputs.zip_sha256 }}' ]; then
            zip_arg=(--zip-sha256 '${{ needs.prepare.outputs.zip_sha256 }}')
          fi
          python3 ci/scripts/release_staging.py --commit "${{ needs.prepare.outputs.source_commit }}" packs-manifest \
            --core dist/LoreForever.zip --extras dist/extra --output dist/packs-proof.json \
            --handover dist/windows/inputs.json "${zip_arg[@]}"
      # Release-only files apart from the installer's (already uploaded in installer-inputs).
      - name: Keep the release extras apart from the installer's inputs
        run: |
          python3 scripts/installer_inputs.py --source dist/extra \
            --installer dist/installer-inputs --release dist/release-extra
      - uses: actions/upload-artifact@v7
        with:
          name: packs-payload-${{ github.run_attempt }}
          path: dist/release-extra/
          compression-level: 0
      - uses: actions/upload-artifact@v7
        with:
          name: packs-proof-${{ github.run_attempt }}
          path: dist/packs-proof.json
          compression-level: 0

  installer:
    needs: prepare
    runs-on: windows-latest
    # Signing logs in to Azure with OIDC. The federated credential trusts this environment, so only jobs in it can
    # sign. GitHub sends the subject with immutable IDs:
    # repo:mliudev@11674155/LoreForever@1391558111:environment:release (not repo:mliudev/LoreForever:...).
    environment: release
    permissions:
      id-token: write
      contents: write
      actions: read
    steps:
      # Only what this job reads (release/installer, and release/logo.ico, which comes with it): the rest of the tree
      # is ~1 GB of recordings, and this job takes those from the zip.
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.source_commit }}
          sparse-checkout: release/installer
      - uses: actions/checkout@v7
        with:
          path: ci
          sparse-checkout: |
            scripts
            release
      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
      # Each file straight from the artifact's storage, several side by side (the whole zip through one stream if that
      # doesn't work), then every file checked against the contract.
      - name: Receive only verified installer inputs while Linux builds the other packs
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: python ci/scripts/release_staging.py --commit "${{ needs.prepare.outputs.source_commit }}" receive --output dist/inputs
      # Windows' own tar unzips the ~5,000 files in seconds; Expand-Archive took 5 times as long. By full path: Git's GNU
      # tar comes first on the runner's PATH, and it can't read zips.
      - id: build
        name: Build the installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist\stage | Out-Null
          & "$env:SystemRoot\System32\tar.exe" -xf dist\inputs\LoreForever.zip -C dist\stage
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $downloadArgs = @("/DDownloadIss=$PWD\dist\inputs\extra\installer-downloads.iss", "/DDownloadUninstallIss=$PWD\dist\inputs\extra\installer-downloads-uninstall.iss")
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /Q "/DAppVersion=${{ needs.prepare.outputs.version }}" `
            "/DSourceDir=$PWD\dist\stage" "/DOutputDir=$PWD\dist" @downloadArgs release\installer\LoreForever.iss
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      # Logged in right before signing: the token is good for minutes, and the wait for the inputs or the build
      # before it ran past that on 1.2.0 (AADSTS700024, 11/6).
      # Code signing (Azure Artifact Signing). Skipped until SIGNING_PROFILE is set (after identity validation), so unsigned
      # releases keep working: AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID, SIGNING_ENDPOINT,
      # SIGNING_ACCOUNT, SIGNING_PROFILE.
      - name: Azure login
        if: vars.SIGNING_PROFILE != ''
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Sign the installer
        if: vars.SIGNING_PROFILE != ''
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ vars.SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.SIGNING_PROFILE }}
          files: ${{ github.workspace }}\dist\LoreForever-Setup.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
      - name: Record the required installer signature evidence
        shell: pwsh
        run: |
          $required = '${{ vars.SIGNING_PROFILE }}' -ne ''
          $signature = [ordered]@{ required = $required; status = 'not_required'; thumbprint = '' }
          if ($required) {
            $sig = Get-AuthenticodeSignature dist\LoreForever-Setup.exe
            "status: $($sig.Status); signer: $($sig.SignerCertificate.Subject)"
            if ($sig.Status -ne 'Valid') { exit 1 }
            $signature.status = 'Valid'
            $signature.thumbprint = $sig.SignerCertificate.Thumbprint
          }
          $signature | ConvertTo-Json | Set-Content -Encoding utf8 dist\signature.json
      # Side by side, each into its own scratch WoW folder (they took 1.9 minutes one after another on 0.18.0). They
      # share nothing: the installer has no SetupMutex or AppMutex, each Setup unpacks itself and its downloads into a
      # {tmp} of its own and stages them in its own folder (.lf-download-stage), its log takes the next free name, and
      # /QA writes no registry, shortcut or uninstaller. A check that fails side by side runs again alone, into a fresh
      # folder, as all three ran before; only a failure there fails the release.
      - name: Four independent first-install checks against this run's downloads
        shell: pwsh
        run: |
          $downloads = Get-Content dist\inputs\extra\transport-downloads.json -Raw | ConvertFrom-Json
          $server = Start-Process python -WindowStyle Hidden -PassThru -ArgumentList '-m','http.server','47864','--bind','127.0.0.1','--directory',"$PWD\dist\inputs\extra"
          $smoke = [ordered]@{ base = $null; female = $null; quests = $null; original = $null }
          $check = {   # one first install and its check: Setup's and verify-install.py's exit codes, and its report
            param($selection, $wow, $root)
            $ErrorActionPreference = 'Stop'   # in its own runspace too: whatever goes wrong is this check's result
            try {
              New-Item -ItemType Directory "$wow\_forever_" | Out-Null
              $voices = if ($selection -eq 'base') { 'none' } else { $selection }
              $installed = Start-Process "$root\dist\LoreForever-Setup.exe" -WindowStyle Hidden -PassThru -Wait -ArgumentList '/QA','/VERYSILENT','/SUPPRESSMSGBOXES',"/DIR=$wow","/VOICES=$voices",'/VOICEURL=http://127.0.0.1:47864/'
              $report, $verified = '', $null
              if ($installed.ExitCode -eq 0) {
                $report = (python "$root\release\installer\qa\verify-install.py" "$root\dist\inputs\LoreForever.zip" $wow "$root\dist\inputs\extra\transport-downloads.json" $selection 2>&1 | ForEach-Object { "$_" }) -join "`n"
                $verified = $LASTEXITCODE
              }
              [pscustomobject]@{ Selection = $selection; Setup = $installed.ExitCode; Verify = $verified; Report = $report }
            } catch {
              [pscustomobject]@{ Selection = $selection; Setup = $null; Verify = $null; Report = "$_" }
            }
          }
          try {
            Start-Sleep 1
            $run = foreach ($selection in 'base','female','quests','original') {
              if ($selection -ne 'base' -and @($downloads.selections.$selection).Count -eq 0) {
                "Unavailable optional selection: $selection; working base/text fallback remains" >> $env:GITHUB_STEP_SUMMARY
                $smoke[$selection] = 'unavailable'
              } else { $selection }
            }
            $root = $PWD.Path; $code = $check.ToString()
            $results = $run | ForEach-Object -ThrottleLimit 4 -Parallel {
              & ([scriptblock]::Create($using:code)) $_ "$env:RUNNER_TEMP\wow-$_" $using:root
            }
            foreach ($selection in $run) {
              $result = @($results | Where-Object Selection -eq $selection)[0]
              "::group::$selection, side by side: Setup exit $($result.Setup ?? 'none'), verify exit $($result.Verify ?? 'none')"
              $result.Report
              "::endgroup::"
              if ($result -and $result.Setup -eq 0 -and $result.Verify -eq 0) { $smoke[$selection] = 'passed'; continue }
              $alone = & $check $selection "$env:RUNNER_TEMP\wow-$selection-alone" $root
              $alone.Report
              if ($alone.Setup -ne 0) { throw "Installer failed for $selection" }
              if ($alone.Verify -ne 0) { throw "Installed bytes/downloads differ for $selection" }
              "::warning::The $selection first-install check failed side by side (Setup exit $($result.Setup ?? 'none'), verify exit $($result.Verify ?? 'none')) and passed alone. If that happens again, the installer doesn't take four installs at once: run these checks one after another."
              $smoke[$selection] = 'passed'
            }
          } finally { Stop-Process -Id $server.Id -ErrorAction SilentlyContinue }
          $smoke | ConvertTo-Json | Set-Content -Encoding utf8 dist\smoke.json
      - name: Freeze the signed installer and successful install evidence
        shell: pwsh
        run: |
          python ci/scripts/release_staging.py --commit "${{ needs.prepare.outputs.source_commit }}" installer-manifest `
            --inputs dist/inputs --setup dist/LoreForever-Setup.exe --signature dist/signature.json `
            --smoke dist/smoke.json --output dist/installer-proof.json
      # Onto the draft while it's one, so it goes in the zip side's publish; once that has published without it, nothing
      # here touches the release and attach-installer adds it. The proof below is uploaded after this, so the release
      # job reads a proof as a finished upload.
      - name: Stage the verified installer directly from Windows, while the release is a draft
        if: needs.prepare.outputs.published != 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: python ci/scripts/release_staging.py --commit "${{ needs.prepare.outputs.source_commit }}" stage --if-draft --manifest dist/installer-proof.json --root dist
      - uses: actions/upload-artifact@v7
        with:
          name: installer-payload-${{ github.run_attempt }}
          path: dist/LoreForever-Setup.exe
          compression-level: 0
      - uses: actions/upload-artifact@v7
        with:
          name: installer-proof-${{ github.run_attempt }}
          path: dist/installer-proof.json
          compression-level: 0

  # Willo, the companion app, is not built here any more: she releases on her own number (willo.yml, tags
  # willo-vX.Y.Z, Mike 11/1), so an add-on release carries no Willo-Setup.exe or Willo-mac.dmg. The old joint
  # releases keep theirs: rebuilding one of those tags leaves her files and manifest rows as they were
  # (scripts/release_staging.py finalize).

  # The zip side, with the Windows installer when its proof is there by then (finalize checks it against the zip's), else
  # without it: a slow or failed signing never holds the zip back (1.2.0 waited on an expired Azure login, 11/6).
  release:
    needs: [prepare, zip]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.source_commit }}
          sparse-checkout: |
            scripts
            release
      - uses: actions/checkout@v7
        with:
          path: ci
          sparse-checkout: |
            scripts
            release
      # Keep proof directories disjoint so failed-job retries can reuse their successful earlier producer.
      - uses: actions/download-artifact@v8
        with:
          pattern: '*-proof-*'
          path: dist/proofs
      - name: Receive payloads only for a previously published tag rebuild
        if: needs.prepare.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 ci/scripts/release_staging.py --commit "${{ needs.prepare.outputs.source_commit }}" legacy-receive \
            --core-only --proofs dist/proofs --output dist/payload
      - name: Verify the complete staged core set and publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
          SIGNING_REQUIRED: ${{ vars.SIGNING_PROFILE != '' }}
        run: |
          notes=(); signed=(); legacy=()
          if [ -f CHANGELOG.md ] && python3 scripts/changelog.py notes "$VERSION" > notes.md; then
            notes=(--notes "$PWD/notes.md")
          fi
          if [ "$SIGNING_REQUIRED" = true ]; then signed=(--signed); fi
          if [ '${{ needs.prepare.outputs.published }}' = true ]; then legacy=(--legacy --root dist); fi
          python3 ci/scripts/release_staging.py --commit "${{ needs.prepare.outputs.source_commit }}" finalize \
            --core-only --proofs dist/proofs --output dist/metadata "${notes[@]}" "${signed[@]}" "${legacy[@]}"

  # Attach optional narration packs and transport metadata after core release and core CurseForge upload finish,
  # updating release-manifest.json and SHA256SUMS.txt monotonically (before curseforge-voices and attach-installer so
  # no two writers or readers race on those two files).
  attach-packs:
    needs: [prepare, release, narration-packs, curseforge]
    if: ${{ !cancelled() && needs.release.result == 'success' && needs.narration-packs.result == 'success' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.source_commit }}
          sparse-checkout: release
      - uses: actions/checkout@v7
        with:
          path: ci
          sparse-checkout: |
            scripts
            release
      - uses: actions/download-artifact@v8
        with:
          pattern: '*-proof-*'
          path: dist/proofs
      - name: Attach verified narration packs and update manifests monotonically
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNING_REQUIRED: ${{ vars.SIGNING_PROFILE != '' }}
        run: |
          signed=(); legacy=()
          if [ "$SIGNING_REQUIRED" = true ]; then signed=(--signed); fi
          if [ '${{ needs.prepare.outputs.published }}' = true ]; then legacy=(--legacy); fi
          python3 ci/scripts/release_staging.py --commit "${{ needs.prepare.outputs.source_commit }}" packs-attach \
            --proofs dist/proofs --output dist/attach-packs "${signed[@]}" "${legacy[@]}"

  # The add-on's Windows installer, when it wasn't ready for the zip side's publish (docs/qa/installers-own-release.md;
  # Mike, 11/14: "these should all have their releases decoupled"): the signed, checked Setup.exe first, then
  # release-manifest.json and SHA256SUMS.txt rewritten to list it. Nothing to do when it went in the publish. After the
  # CurseForge jobs and attach-packs, so no writer or reader races on release-manifest.json or SHA256SUMS.txt, while
  # still succeeding whenever optional narration packs are skipped or fail. A failed installer is finished with
  # scripts/release-installers.sh --windows X.Y.Z (it re-runs installer and this job only, then moves the site's
  # installer slot). Not a required job: scripts/release_workflow.py waits for zip and release.
  attach-installer:
    needs: [prepare, release, installer, curseforge, attach-packs, curseforge-voices]
    if: ${{ !cancelled() && needs.release.result == 'success' && needs.installer.result == 'success' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.source_commit }}
          sparse-checkout: release
      - uses: actions/checkout@v7
        with:
          path: ci
          sparse-checkout: |
            scripts
            release
      - uses: actions/download-artifact@v8
        with:
          pattern: '*-proof-*'
          path: dist/proofs
      - name: Attach the signed installer and list it
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNING_REQUIRED: ${{ vars.SIGNING_PROFILE != '' }}
        run: |
          signed=(); legacy=()
          if [ "$SIGNING_REQUIRED" = true ]; then signed=(--signed); fi
          if [ '${{ needs.prepare.outputs.published }}' = true ]; then legacy=(--legacy); fi
          python3 ci/scripts/release_staging.py --commit "${{ needs.prepare.outputs.source_commit }}" installer-attach \
            --proofs dist/proofs --output dist/attach "${signed[@]}" "${legacy[@]}"

  # CurseForge is the main download channel. Needs the repo secret CF_API_TOKEN (CurseForge > Account > API tokens);
  # without it this job fails. The project ID and game version come from the .toc (## X-Curse-Project-ID, and
  # ## Interface 16001 -> Forever 1.60.1); the narration that has CurseForge projects of its own, from
  # release/curseforge.json.
  curseforge:
    needs: [zip, release]
    if: github.event_name == 'push' || inputs.curseforge
    runs-on: ubuntu-24.04
    env:
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.zip.outputs.version }}
    steps:
      # CHANGELOG.md, scripts/changelog.py and the core's .toc
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
          sparse-checkout: |
            scripts
            addon/LoreForever
      # scripts/curseforge_voices.py and release/curseforge.json from this run's own commit, like this file: the tag on
      # a push, main on Run workflow, so a rerun for an older tag goes by today's narration projects.
      - uses: actions/checkout@v7
        with:
          path: ci
          sparse-checkout: |
            scripts
            release
      - name: Fetch only the already verified core download
        run: |
          mkdir -p dist
          gh release download "$TAG" -R "$GH_REPO" -p LoreForever.zip -p SHA256SUMS.txt -D dist
          cd dist
          grep '  LoreForever.zip$' SHA256SUMS.txt | sha256sum -c -
      - name: Upload to CurseForge
        run: |
          if [ -z "$CF_API_TOKEN" ]; then
            echo "::error::CF_API_TOKEN is empty, so the zip wasn't uploaded to CurseForge. Set it (gh secret set CF_API_TOKEN) and rerun this job."
            exit 1
          fi
          toc=addon/LoreForever/LoreForever.toc
          project=$(sed -n 's/^## X-Curse-Project-ID: *//p' "$toc" | tr -d '\r')
          iface=$(sed -n 's/^## Interface: *//p' "$toc" | tr -d '\r')
          game="$((10#${iface:0:-4})).$((10#${iface: -4:2})).$((10#${iface: -2:2}))"
          # 88568 is CurseForge's "Forever" game version type.
          versions=$(curl -sSf --retry 3 -H "X-Api-Token: $CF_API_TOKEN" https://wow.curseforge.com/api/game/wow/versions)
          id=$(jq -r --arg v "$game" 'map(select(.gameVersionTypeID == 88568 and .name == $v)) | .[0].id // empty' <<<"$versions")
          if [ -z "$id" ]; then
            newest=$(jq -c 'map(select(.gameVersionTypeID == 88568)) | max_by(.id) // empty' <<<"$versions")
            [ -n "$newest" ] || { echo "::error::CurseForge lists no Forever game versions"; exit 1; }
            id=$(jq -r .id <<<"$newest")
            echo "::warning::CurseForge has no Forever version $game; tagging the newest one, $(jq -r .name <<<"$newest")"
          fi
          python3 scripts/changelog.py notes "$VERSION" > notes.md
          # CurseForge's copy of the zip (release/curseforge.json): without the narration that's live as a CurseForge
          # project of its own, which this file then lists as a dependency, so the app installs it along with the
          # add-on. And under CurseForge's upload limit of about 500 MB (HTTP 413 for 0.7.0's 701 MB zip; 0.6.0's
          # 388 MB went through): over it, also without the packs whose projects aren't live yet, and its notes say
          # where the full download is. Every file in it is byte for byte the release zip's.
          python3 ci/scripts/curseforge_voices.py core dist/LoreForever.zip dist/curseforge
          if [ -f dist/curseforge/manual ]; then
            # One package by hand (release/curseforge.json, core_upload: manual): the website takes up to 2 GB.
            { echo "CurseForge: upload by hand. One package with nothing cut down: this release's LoreForever.zip ($(cat dist/curseforge/manual) MB) and LoreForever_Voice_Female-complete.zip merged into one (python3 scripts/curseforge_voices.py package DIR OUT, DIR holding the release's zips; without her only if that's over 2 GB). The upload API refuses files over about 500 MB, the website takes up to 2 GB."
              echo
              echo "At https://authors.curseforge.com/#/projects/$project/files upload it as \"Lore Forever $VERSION\", game version Forever $game, release type Release, with this changelog (Markdown):"
              echo
              cat notes.md; } >> "$GITHUB_STEP_SUMMARY"
            echo "Not uploaded: CurseForge gets this release's zip by hand (core_upload: manual)"
            exit 0
          fi
          cat dist/curseforge/notes.md >> notes.md
          jq -n --rawfile log notes.md --arg name "Lore Forever $VERSION" --argjson id "$id" \
            --slurpfile rel dist/curseforge/relations.json \
            '{displayName: $name, gameVersions: [$id], releaseType: "release", changelog: $log, changelogType: "markdown"}
             + (if ($rel[0].projects | length) > 0 then {relations: $rel[0]} else {} end)' \
            > metadata.json
          code=$(curl -sS --retry 3 --retry-delay 10 -o result.json -w '%{http_code}' \
            -H "X-Api-Token: $CF_API_TOKEN" -F "metadata=<metadata.json" -F "file=@dist/curseforge/LoreForever.zip" \
            "https://wow.curseforge.com/api/projects/$project/upload-file")
          cat result.json; echo
          [ "$code" = 200 ] || { echo "::error::CurseForge upload failed (HTTP $code)"; exit 1; }
          main=$(jq -r .id result.json)
          echo "Uploaded Lore Forever $VERSION to CurseForge project $project (file $main); it goes live after moderation." \
            >> "$GITHUB_STEP_SUMMARY"

  # The narration with CurseForge projects of its own (release/curseforge.json; each narrator's stories and its quest
  # dialogue): each project's folders, from the release just published, go to it as requiring Lore Forever whenever
  # the narration in them changed since its last upload (scripts/curseforge_voices.py records those on the
  # "curseforge" release; CurseForge refuses an unchanged re-upload). A project with no id yet is skipped, so this does
  # nothing until one exists. A job of its own, so narration can't hold up the add-on's upload. The same upload
  # without a release: the "CurseForge voices" workflow (voices.yml).
  curseforge-voices:
    needs: [zip, release, attach-packs]
    if: ${{ !cancelled() && (github.event_name == 'push' || inputs.curseforge) && needs.release.result == 'success' && needs.attach-packs.result == 'success' }}
    runs-on: ubuntu-24.04
    env:
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.zip.outputs.version }}
    steps:
      # scripts/curseforge_voices.py, release/curseforge.json and the core's .toc (for the game version). From the commit
      # this run is for: the tag on a push, main on Run workflow, so a project id added since the tag counts.
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            scripts
            release
            addon/LoreForever
      - name: Upload the voices
        run: python3 scripts/curseforge_voices.py upload --from-release
