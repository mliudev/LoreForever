# Willo on her own (Mike, 2026-10-28: "decouple willo releases from addon releases"): Willo-Setup.exe, the companion
# app, built and signed exactly as the Release workflow's willo job does, published as a GitHub release of its own,
# vX.Y.Z on this repo's main, never marked Latest. Nothing of the add-on: no zip, no Setup.exe, no CurseForge, no
# language packs, and the add-on's version stays where it is.
# The maintainer's scripts/release-willo.sh (scripts/release.sh --willo) starts it, waits for it, then moves the site's
# /download/willo to it (scripts/download_snapshot.py --willo), which is what installed Willos read to update.
# publish: false builds, signs and test-installs everything and publishes nothing (release-willo.sh --rehearse).
# Willo for Mac (LOR-636) builds beside her, as the Release workflow's willo-mac job does: Willo-mac.dmg goes on the
# release when that job left a proof, and never holds it up (continue-on-error; the publish job takes what's ready).
# The tag comes from the release's publication with this run's own token, which starts no workflow, so the Release
# workflow never runs for it (and its prepare job would refuse a tag that doesn't match the add-on's .toc anyway).
name: Willo
run-name: Willo ${{ inputs.version }}${{ !inputs.publish && ' (rehearsal)' || '' }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Willo's version, e.g. 0.31.1: newer than the add-on's and the last Willo's"
        required: true
      companion_ref:
        description: "The private repo's commit to build Willo from (40 hex)"
        required: true
      notes:
        description: "The release's notes (Markdown); empty: a line of its own"
        required: false
        default: ''
      publish:
        description: "Publish the release (off: build, sign and test-install only)"
        type: boolean
        default: true

permissions:
  contents: write
  actions: read

concurrency:
  group: willo-release
  cancel-in-progress: false

env:
  GH_REPO: ${{ github.repository }}
  TAG: v${{ inputs.version }}

jobs:
  willo:
    runs-on: windows-latest
    # The release environment's signing login (Azure OIDC) and COMPANION_SOURCE_TOKEN, as the Release workflow's.
    environment: release
    permissions:
      id-token: write
      contents: write
      actions: read
    steps:
      - name: Check the inputs
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          REF: ${{ inputs.companion_ref }}
        run: |
          if ($env:VERSION -notmatch '^\d+\.\d+\.\d+$') { "::error::version must look like 0.31.1, not '$env:VERSION'"; exit 1 }
          if ($env:REF -notmatch '^[0-9a-f]{40}$') { "::error::companion_ref must be a full commit id"; exit 1 }
          $draft = gh api "repos/$env:GH_REPO/releases?per_page=30" -q ".[] | select(.tag_name == \"$env:TAG\") | .draft"
          if ($draft -eq 'false') { "::error::$env:TAG is already a published release"; exit 1 }
          gh api "repos/$env:GH_REPO/git/ref/tags/$env:TAG" 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0 -and $draft -ne 'true') { "::error::the tag $env:TAG already exists"; exit 1 }
          $global:LASTEXITCODE = 0
      # This commit's release/installer (the wizard's pictures) and the add-on's lore as the last release shipped it
      # (publish-public.sh only syncs at a release), for the vectors Willo ships with (LOR-613).
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            release/installer
            addon/LoreForever/Data
            scripts
      - name: Check out Willo's source (private, read-only)
        uses: actions/checkout@v7
        with:
          repository: mliudev/lore-forever
          ref: ${{ inputs.companion_ref }}
          token: ${{ secrets.COMPANION_SOURCE_TOKEN }}
          path: companion-src
          sparse-checkout: |
            companion
            data/pronunciation.json
          sparse-checkout-cone-mode: false
      - uses: astral-sh/setup-uv@v10.3.0
      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
      - name: Azure login
        if: vars.SIGNING_PROFILE != ''
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Last release's lore vectors
        continue-on-error: true
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $run = gh run list -R $env:GITHUB_REPOSITORY --workflow release.yml --status success -L 1 --json databaseId -q '.[0].databaseId'
          if ($run) { gh run download $run -R $env:GITHUB_REPOSITORY -n lore-vectors -D "$env:RUNNER_TEMP\lore-seed" }
      - name: Build Willo
        shell: pwsh
        env:
          LORE_COMPANION_VERSION: ${{ inputs.version }}
        run: |
          companion-src\companion\packaging\build.ps1 -Out "$env:RUNNER_TEMP\companion" -Work "$env:RUNNER_TEMP\companion-build" `
            -Lore addon\LoreForever -LoreSeed "$env:RUNNER_TEMP\lore-seed\lore-vectors.npz"
      - name: Sign Willo
        if: vars.SIGNING_PROFILE != ''
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ vars.SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.SIGNING_PROFILE }}
          files: ${{ runner.temp }}\companion\LoreForeverCompanion\LoreForeverCompanion.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
      - name: Build Willo-Setup.exe
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /Q "/DAppVersion=${{ inputs.version }}" `
            "/DCompanionDir=$env:RUNNER_TEMP\companion\LoreForeverCompanion" "/DOutputDir=$PWD\dist" `
            "/DWizardDir=$PWD\release\installer" companion-src\companion\packaging\Willo.iss
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Sign Willo-Setup.exe
        if: vars.SIGNING_PROFILE != ''
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ vars.SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.SIGNING_PROFILE }}
          files: ${{ github.workspace }}\dist\Willo-Setup.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
      # The Release workflow's willo job's checks: both signatures, and a /QA install into scratch.
      - name: Check the signatures and test-install
        shell: pwsh
        run: |
          $required = '${{ vars.SIGNING_PROFILE }}' -ne ''
          $signature = [ordered]@{ required = $required; status = 'not_required'; thumbprint = '' }
          $scratch = "$env:RUNNER_TEMP\willo-qa"
          New-Item -ItemType Directory "$scratch\app", "$scratch\wow\_forever_" -Force | Out-Null
          $installed = Start-Process dist\Willo-Setup.exe -Wait -PassThru -ArgumentList '/QA', '/VERYSILENT', '/SUPPRESSMSGBOXES',
            "/DIR=$scratch\app", "/GAMEDIR=$scratch\wow", "/LOG=$env:RUNNER_TEMP\willo-qa.log"
          $app = "$scratch\app\LoreForeverCompanion.exe"
          if ($installed.ExitCode -or -not (Test-Path $app)) { Get-Content "$env:RUNNER_TEMP\willo-qa.log" -Tail 40; throw "Willo-Setup.exe didn't install" }
          if (Test-Path "$scratch\app\unins000.exe") { throw "/QA left an uninstaller" }
          if ($required) {
            foreach ($file in "dist\Willo-Setup.exe", $app) {
              $sig = Get-AuthenticodeSignature $file
              "$(Split-Path -Leaf $file): $($sig.Status); signer: $($sig.SignerCertificate.Subject)"
              if ($sig.Status -ne 'Valid') { exit 1 }
            }
            $signature.status = 'Valid'
            $signature.thumbprint = (Get-AuthenticodeSignature dist\Willo-Setup.exe).SignerCertificate.Thumbprint
          }
          $signature | ConvertTo-Json | Set-Content -Encoding utf8 dist\willo-signature.json
          "### Willo-Setup.exe ${{ inputs.version }}: {0:N0} MB (mliudev/lore-forever@${{ inputs.companion_ref }})" -f ((Get-Item dist\Willo-Setup.exe).Length / 1MB) >> $env:GITHUB_STEP_SUMMARY
      - name: Freeze the signed Willo installer
        shell: pwsh
        run: |
          python scripts/release_staging.py --commit "$(git rev-parse HEAD)" willo-manifest `
            --setup dist/Willo-Setup.exe --signature dist/willo-signature.json --output dist/willo-proof.json
      - uses: actions/upload-artifact@v7
        with:
          name: willo-${{ inputs.version }}-${{ github.run_attempt }}
          path: |
            dist/Willo-Setup.exe
            dist/willo-proof.json
          compression-level: 0

  # Willo for Mac (LOR-636): as the Release workflow's willo-mac job (its comments there), from the same companion_ref.
  willo-mac:
    runs-on: macos-15
    environment: release
    continue-on-error: true
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
    outputs:
      ready: ${{ steps.proof.outputs.ready }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: scripts
      - id: go
        name: The Mac secrets
        env:
          COMPANION_SOURCE_TOKEN: ${{ secrets.COMPANION_SOURCE_TOKEN }}
          MAC_CERT_P12: ${{ secrets.MAC_CERT_P12 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          missing=''
          for s in COMPANION_SOURCE_TOKEN MAC_CERT_P12 MAC_CERT_PASSWORD NOTARY_KEY_P8 NOTARY_KEY_ID NOTARY_ISSUER_ID; do
            [ -n "${!s}" ] || missing="$missing $s"
          done
          if [ -n "$missing" ]; then
            echo "::warning::No Willo-mac.dmg in this release: the release environment has no$missing"
            echo "go=false" >> "$GITHUB_OUTPUT"
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Check out Willo's source (private, read-only)
        if: steps.go.outputs.go == 'true'
        uses: actions/checkout@v7
        with:
          repository: mliudev/lore-forever
          ref: ${{ inputs.companion_ref }}
          token: ${{ secrets.COMPANION_SOURCE_TOKEN }}
          path: companion-src
          # The add-on's lore too: the build carries it for a new player's first answers (build-mac.sh seed_lore).
          sparse-checkout: |
            companion
            data/pronunciation.json
            addon/LoreForever/Data/Index.lua
            addon/LoreForever/Data/Z_*.lua
            addon/LoreForever/ModelRaces.lua
            addon/LoreForever/LoreForever.toc
          sparse-checkout-cone-mode: false
      - uses: astral-sh/setup-uv@v10.3.0
        if: steps.go.outputs.go == 'true'
      - id: build
        name: Build, sign, notarize, staple and start Willo-mac.dmg
        if: steps.go.outputs.go == 'true'
        env:
          LORE_COMPANION_VERSION: ${{ inputs.version }}
          MAC_CERT_P12: ${{ secrets.MAC_CERT_P12 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          script=companion-src/companion/packaging/mac-release.sh
          [ -f "$script" ] || { echo "::warning::Willo's commit has no mac-release.sh yet: no Willo-mac.dmg in this release"; exit 0; }
          rc=0; bash "$script" --out dist --wait 10 || rc=$?
          [ "$rc" = 3 ] && exit 0     # Apple still notarizing: a warning (mac-release.sh said so), no .dmg this time
          [ "$rc" = 0 ] || exit "$rc"
          echo "built=true" >> "$GITHUB_OUTPUT"
          echo "### Willo-mac.dmg ${{ inputs.version }}: $(du -h dist/Willo-mac.dmg | cut -f1), notarized and stapled (mliudev/lore-forever@${{ inputs.companion_ref }})" >> "$GITHUB_STEP_SUMMARY"
      - name: Freeze the notarized Willo for Mac
        if: steps.build.outputs.built == 'true'
        run: |
          python3 scripts/release_staging.py --commit "$(git rev-parse HEAD)" mac-manifest \
            --dmg dist/Willo-mac.dmg --signature dist/mac-signature.json --output dist/mac-proof.json
      - uses: actions/upload-artifact@v7
        if: steps.build.outputs.built == 'true'
        with:
          name: mac-${{ inputs.version }}-${{ github.run_attempt }}
          path: |
            dist/Willo-mac.dmg
            dist/mac-proof.json
          compression-level: 0
      - id: proof
        if: steps.build.outputs.built == 'true'
        run: echo "ready=true" >> "$GITHUB_OUTPUT"

  # The release, once Windows' Willo is signed and test-installed: hers always, the Mac's when its job got that far.
  publish:
    needs: [willo, willo-mac]
    if: ${{ !cancelled() && needs.willo.result == 'success' && inputs.publish }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: scripts
      # Every attempt's, in folders of their own: a rerun of a failed job reuses the others' (the newest is taken).
      - uses: actions/download-artifact@v8
        with:
          pattern: willo-${{ inputs.version }}-*
          path: dist/willo
      - uses: actions/download-artifact@v8
        if: needs.willo-mac.outputs.ready == 'true'
        with:
          pattern: mac-${{ inputs.version }}-*
          path: dist/mac
      - name: Publish Willo ${{ inputs.version }} on a release of its own (not Latest)
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: ${{ inputs.notes }}
          MAC: ${{ needs.willo-mac.outputs.ready }}
        run: |
          # The newest attempt's folder (willo-0.31.2-2 over -1), or nothing; never a failed pipeline (bash -eo pipefail).
          newest() { { ls -d "$1"/*-"${{ inputs.version }}"-* 2>/dev/null || true; } | sort -t- -k3 -n | tail -1; }
          willo="$(newest dist/willo)"
          [ -n "$willo" ] || { echo "::error::no willo-${{ inputs.version }}-* artifact"; exit 1; }
          notes=(); signed=(); mac=()
          if [ -n "$NOTES" ]; then printf '%s\n' "$NOTES" > dist/notes.md; notes=(--notes dist/notes.md); fi
          if [ '${{ vars.SIGNING_PROFILE }}' != '' ]; then signed=(--signed); fi
          if [ "$MAC" = true ] && macdir="$(newest dist/mac)" && [ -n "$macdir" ]; then
            mac=(--mac-manifest "$macdir/mac-proof.json" --root "$macdir/Willo-mac.dmg")
          else
            echo "::warning::No Willo-mac.dmg this time (see the willo-mac job): Willo ${{ inputs.version }} goes out without it, and the site keeps the last one."
          fi
          python3 scripts/release_staging.py --commit "$(git rev-parse HEAD)" willo-release \
            --manifest "$willo/willo-proof.json" --root "$willo/Willo-Setup.exe" "${mac[@]}" --output dist/metadata \
            "${notes[@]}" "${signed[@]}"
          echo "Published https://github.com/$GH_REPO/releases/tag/$TAG (not Latest)" >> "$GITHUB_STEP_SUMMARY"
