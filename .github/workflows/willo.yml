# Willo on her own (Mike, 2026-10-28: "decouple willo releases from addon releases"; her own version number apart from
# the add-on's, 11/1): Willo-Setup.exe, the companion app, built and signed, published as a GitHub release of its own,
# willo-vX.Y.Z on this repo's main, never marked Latest (the add-on's release keeps that: /download/zip and install.ps1
# follow Latest). Nothing of the add-on: no zip, no Setup.exe, no CurseForge, no language packs, and the add-on's
# version stays where it is. The Release workflow doesn't build her any more: this is the only place Willo is built.
# The maintainer's scripts/release-willo.sh (scripts/release.sh --willo) starts it, waits for it, then moves the site's
# /download/willo-own to it (scripts/download_snapshot.py --willo), which is what installed Willos read to update.
# publish: false builds, signs and test-installs everything and publishes nothing (release-willo.sh --rehearse).
# Willo for Mac (LOR-636) builds beside her from the same companion_ref, and each platform publishes on its own (Mike,
# 11/13: "Let's keep these releases all separate from each other"; docs/qa/willo-publish-split.md): publish needs only
# the Windows build, publish-mac only the Mac's. Whichever lands first creates the release with its file, the other
# adds its file to it (release_staging.py willo-release), one at a time under a per-version lock. A Mac that fails or
# runs past Apple's wait fails its job, red, and never holds Windows; a failed Windows never holds a ready Mac. "Re-run
# failed jobs" on this run (release-willo.sh --finish X.Y.Z) finishes the late one from the same commit, and
# release-willo.sh moves each platform's feed entry once its file is on the release and downloads.
# The tag comes from the release's publication with this run's own token, which starts no workflow, so the Release
# workflow never runs for it (its tag filter is v[0-9]*, and its prepare job would refuse a tag that doesn't match the
# add-on's .toc anyway).
name: Willo
run-name: Willo ${{ inputs.version }}${{ !inputs.publish && ' (rehearsal)' || '' }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Willo's version, e.g. 0.37.0: newer than the last Willo's (her number, not the add-on's)"
        required: true
      companion_ref:
        description: "The private repo's commit to build Willo from (40 hex)"
        required: true
      notes:
        description: "The release's notes (Markdown); empty: a line of its own"
        required: false
        default: ''
      publish:
        description: "Publish the release (off: build, sign and test-install only)"
        type: boolean
        default: true

permissions:
  contents: write
  actions: read

# Per version: a late Mac job of one release never holds the next release's run.
concurrency:
  group: willo-release-${{ inputs.version }}
  cancel-in-progress: false

env:
  GH_REPO: ${{ github.repository }}
  TAG: willo-v${{ inputs.version }}

jobs:
  willo:
    runs-on: windows-latest
    # The release environment's signing login (Azure OIDC) and COMPANION_SOURCE_TOKEN, as the Release workflow's.
    environment: release
    permissions:
      id-token: write
      contents: write
      actions: read
    steps:
      - name: Check the inputs
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          REF: ${{ inputs.companion_ref }}
        run: |
          if ($env:VERSION -notmatch '^\d+\.\d+\.\d+$') { "::error::version must look like 0.37.0, not '$env:VERSION'"; exit 1 }
          if ($env:REF -notmatch '^[0-9a-f]{40}$') { "::error::companion_ref must be a full commit id"; exit 1 }
          # The tag reaches jq through env, not quotes: pwsh passed \" as two arguments, so this never matched before.
          $draft = gh api "repos/$env:GH_REPO/releases?per_page=30" -q '.[] | select(.tag_name == env.TAG) | .draft'
          # Published already is fine only when this run published it (its Mac landed first; this is a re-run).
          if ($draft -eq 'false') {
            $by = gh release download $env:TAG -R $env:GH_REPO -p release-manifest.json -O - 2>$null | ConvertFrom-Json
            if ("$($by.binding.runId)" -ne "$env:GITHUB_RUN_ID") { "::error::$env:TAG is already a published release, made by another run"; exit 1 }
            $draft = 'ours'
          }
          gh api "repos/$env:GH_REPO/git/ref/tags/$env:TAG" 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0 -and $draft -notin 'true', 'ours') { "::error::the tag $env:TAG already exists"; exit 1 }
          $global:LASTEXITCODE = 0
      # This commit's release/installer (the wizard's pictures).
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            release/installer
            scripts
      - name: Check out Willo's source (private, read-only)
        uses: actions/checkout@v7
        with:
          repository: mliudev/lore-forever
          ref: ${{ inputs.companion_ref }}
          token: ${{ secrets.COMPANION_SOURCE_TOKEN }}
          path: companion-src
          sparse-checkout: |
            companion
            data/pronunciation.json
          sparse-checkout-cone-mode: false
      - uses: astral-sh/setup-uv@v10.3.0
      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
      - name: Build Willo
        shell: pwsh
        env:
          LORE_COMPANION_VERSION: ${{ inputs.version }}
        run: |
          companion-src\companion\packaging\build.ps1 -Out "$env:RUNNER_TEMP\companion" -Work "$env:RUNNER_TEMP\companion-build"
      # Logged in right before signing: the token is good for minutes, and the wait for the inputs or the build
      # before it ran past that on 1.2.0 (AADSTS700024, 11/6).
      - name: Azure login
        if: vars.SIGNING_PROFILE != ''
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Sign Willo
        if: vars.SIGNING_PROFILE != ''
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ vars.SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.SIGNING_PROFILE }}
          files: ${{ runner.temp }}\companion\LoreForeverCompanion\LoreForeverCompanion.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
      - name: Build Willo-Setup.exe
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /Q "/DAppVersion=${{ inputs.version }}" `
            "/DCompanionDir=$env:RUNNER_TEMP\companion\LoreForeverCompanion" "/DOutputDir=$PWD\dist" `
            "/DWizardDir=$PWD\release\installer" companion-src\companion\packaging\Willo.iss
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Sign Willo-Setup.exe
        if: vars.SIGNING_PROFILE != ''
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ vars.SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.SIGNING_PROFILE }}
          files: ${{ github.workspace }}\dist\Willo-Setup.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
      # Both signatures (Setup and the app inside it), and a /QA install into scratch: Willo's files land, nothing of the
      # runner's own Windows entries changes. The full install, upgrade and sign-in screen are the private repo's
      # Companion workflow (companion.yml), which the Willo candidate runs before a release.
      - name: Check the signatures and test-install
        shell: pwsh
        run: |
          $required = '${{ vars.SIGNING_PROFILE }}' -ne ''
          $signature = [ordered]@{ required = $required; status = 'not_required'; thumbprint = '' }
          $scratch = "$env:RUNNER_TEMP\willo-qa"
          New-Item -ItemType Directory "$scratch\app", "$scratch\wow\_forever_" -Force | Out-Null
          $installed = Start-Process dist\Willo-Setup.exe -Wait -PassThru -ArgumentList '/QA', '/VERYSILENT', '/SUPPRESSMSGBOXES',
            "/DIR=$scratch\app", "/GAMEDIR=$scratch\wow", "/LOG=$env:RUNNER_TEMP\willo-qa.log"
          $app = "$scratch\app\LoreForeverCompanion.exe"
          if ($installed.ExitCode -or -not (Test-Path $app)) { Get-Content "$env:RUNNER_TEMP\willo-qa.log" -Tail 40; throw "Willo-Setup.exe didn't install" }
          if (Test-Path "$scratch\app\unins000.exe") { throw "/QA left an uninstaller" }
          if ($required) {
            foreach ($file in "dist\Willo-Setup.exe", $app) {
              $sig = Get-AuthenticodeSignature $file
              "$(Split-Path -Leaf $file): $($sig.Status); signer: $($sig.SignerCertificate.Subject)"
              if ($sig.Status -ne 'Valid') { exit 1 }
            }
            $signature.status = 'Valid'
            $signature.thumbprint = (Get-AuthenticodeSignature dist\Willo-Setup.exe).SignerCertificate.Thumbprint
          }
          $signature | ConvertTo-Json | Set-Content -Encoding utf8 dist\willo-signature.json
          "### Willo-Setup.exe ${{ inputs.version }}: {0:N0} MB (mliudev/lore-forever@${{ inputs.companion_ref }})" -f ((Get-Item dist\Willo-Setup.exe).Length / 1MB) >> $env:GITHUB_STEP_SUMMARY
      - name: Freeze the signed Willo installer
        shell: pwsh
        run: |
          python scripts/release_staging.py --commit "$(git rev-parse HEAD)" willo-manifest `
            --setup dist/Willo-Setup.exe --signature dist/willo-signature.json --output dist/willo-proof.json `
            --companion-ref "$(git -C companion-src rev-parse HEAD)"
      - uses: actions/upload-artifact@v7
        with:
          name: willo-${{ inputs.version }}-${{ github.run_attempt }}
          path: |
            dist/Willo-Setup.exe
            dist/willo-proof.json
          compression-level: 0

  # Willo for Mac (LOR-636): Willo-mac.dmg beside Willo-Setup.exe, from the same companion_ref, on GitHub's hosted Apple
  # Silicon runner. The private repo's companion/packaging/mac-release.sh builds it with build-mac.sh (as the Macs' test
  # builds), signs it with the Developer ID, has Apple notarize it, staples it, asks Gatekeeper and starts it once from
  # the .dmg before anything is staged; `ready` is set only once its proof is left. Without the Mac secrets in the
  # release environment, or when Apple is still notarizing after 10 minutes, the job fails (red, so "Re-run failed jobs"
  # picks it up): Windows has gone out on its own already, and the site keeps the last Mac until this one lands.
  willo-mac:
    runs-on: macos-15
    environment: release
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
    outputs:
      ready: ${{ steps.proof.outputs.ready }}
    steps:
      # Its own input check: since the split, the Mac publishes without the Windows job's.
      - name: Check the inputs
        env:
          VERSION: ${{ inputs.version }}
          REF: ${{ inputs.companion_ref }}
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::version must look like 0.37.0"; exit 1; }
          [[ "$REF" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::companion_ref must be a full commit id"; exit 1; }
      - uses: actions/checkout@v7
        with:
          sparse-checkout: scripts
      - id: go
        name: The Mac secrets
        env:
          COMPANION_SOURCE_TOKEN: ${{ secrets.COMPANION_SOURCE_TOKEN }}
          MAC_CERT_P12: ${{ secrets.MAC_CERT_P12 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          missing=''
          for s in COMPANION_SOURCE_TOKEN MAC_CERT_P12 MAC_CERT_PASSWORD NOTARY_KEY_P8 NOTARY_KEY_ID NOTARY_ISSUER_ID; do
            [ -n "${!s}" ] || missing="$missing $s"
          done
          if [ -n "$missing" ]; then
            echo "::error::No Willo-mac.dmg yet: the release environment has no$missing"
            exit 1
          fi
          echo "go=true" >> "$GITHUB_OUTPUT"
      - name: Check out Willo's source (private, read-only)
        if: steps.go.outputs.go == 'true'
        uses: actions/checkout@v7
        with:
          repository: mliudev/lore-forever
          ref: ${{ inputs.companion_ref }}
          token: ${{ secrets.COMPANION_SOURCE_TOKEN }}
          path: companion-src
          sparse-checkout: |
            companion
            data/pronunciation.json
          sparse-checkout-cone-mode: false
      - uses: astral-sh/setup-uv@v10.3.0
        if: steps.go.outputs.go == 'true'
      - id: build
        name: Build, sign, notarize, staple and start Willo-mac.dmg
        if: steps.go.outputs.go == 'true'
        env:
          LORE_COMPANION_VERSION: ${{ inputs.version }}
          MAC_CERT_P12: ${{ secrets.MAC_CERT_P12 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          script=companion-src/companion/packaging/mac-release.sh
          [ -f "$script" ] || { echo "::error::Willo's commit has no mac-release.sh: no Willo-mac.dmg"; exit 1; }
          rc=0; bash "$script" --out dist --wait 10 || rc=$?
          # Apple still notarizing (mac-release.sh said so): red, so a re-run of the failed jobs submits it again later.
          if [ "$rc" = 3 ]; then
            echo "::error::Apple hadn't finished notarizing Willo-mac.dmg in 10 minutes: re-run the failed jobs (scripts/release-willo.sh --finish $LORE_COMPANION_VERSION)"
            exit 1
          fi
          [ "$rc" = 0 ] || exit "$rc"
          echo "built=true" >> "$GITHUB_OUTPUT"
          echo "### Willo-mac.dmg $LORE_COMPANION_VERSION: $(du -h dist/Willo-mac.dmg | cut -f1), notarized and stapled (mliudev/lore-forever@$(git -C companion-src rev-parse HEAD))" >> "$GITHUB_STEP_SUMMARY"
      - name: Freeze the notarized Willo for Mac
        if: steps.build.outputs.built == 'true'
        run: |
          python3 scripts/release_staging.py --commit "$(git rev-parse HEAD)" mac-manifest \
            --dmg dist/Willo-mac.dmg --signature dist/mac-signature.json --output dist/mac-proof.json \
            --companion-ref "$(git -C companion-src rev-parse HEAD)"
      - uses: actions/upload-artifact@v7
        if: steps.build.outputs.built == 'true'
        with:
          name: mac-${{ inputs.version }}-${{ github.run_attempt }}
          path: |
            dist/Willo-mac.dmg
            dist/mac-proof.json
          compression-level: 0
      - id: proof
        if: steps.build.outputs.built == 'true'
        run: echo "ready=true" >> "$GITHUB_OUTPUT"

  # Each platform publishes on its own, as soon as its build left a proof: Windows here, the Mac in publish-mac below.
  # Both run scripts/publish_willo_platform.sh (release_staging.py willo-release), which creates the release or adds
  # this platform's file to it, one at a time per version (the lock), so the two never rewrite the manifest at once.
  publish:
    needs: willo
    if: ${{ !cancelled() && needs.willo.result == 'success' && inputs.publish }}
    runs-on: ubuntu-24.04
    concurrency:
      group: willo-publish-${{ inputs.version }}
      cancel-in-progress: false
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: scripts
      # Every attempt's, in folders of their own: a rerun of a failed job reuses the others' (the newest is taken).
      - uses: actions/download-artifact@v8
        with:
          pattern: willo-${{ inputs.version }}-*
          path: dist/willo
      - name: Publish Willo-Setup.exe ${{ inputs.version }} (not Latest)
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: ${{ inputs.notes }}
          REF: ${{ inputs.companion_ref }}
          VERSION: ${{ inputs.version }}
          SIGNED: ${{ vars.SIGNING_PROFILE != '' }}
        run: bash scripts/publish_willo_platform.sh win dist/willo willo-proof.json Willo-Setup.exe

  publish-mac:
    needs: willo-mac
    if: ${{ !cancelled() && needs.willo-mac.outputs.ready == 'true' && inputs.publish }}
    runs-on: ubuntu-24.04
    concurrency:
      group: willo-publish-${{ inputs.version }}
      cancel-in-progress: false
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: scripts
      - uses: actions/download-artifact@v8
        with:
          pattern: mac-${{ inputs.version }}-*
          path: dist/mac
      - name: Publish Willo-mac.dmg ${{ inputs.version }} (not Latest)
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: ${{ inputs.notes }}
          REF: ${{ inputs.companion_ref }}
          VERSION: ${{ inputs.version }}
          SIGNED: ${{ vars.SIGNING_PROFILE != '' }}
        run: bash scripts/publish_willo_platform.sh mac dist/mac mac-proof.json Willo-mac.dmg
